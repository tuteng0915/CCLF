## spec-11v2: Diffusion Forcing — gate to t >= df_t_min
## Same 7 conditions but with df_t_min=0.7 (apply DF only in last 30% of trajectory)
## Addresses the early-step degeneration seen in spec11_df.yml (v1)

# Control: standard ODE (same as before)
- sampling_method: ode
  num_sampling_steps: [32]
  cfgs: [1]
  self_cond_cfg_scales: [1.0]
  time_schedule: uniform
  df_variant: none

# Variant 1 (freeze): entropy threshold 0.3, t >= 0.7 only
- sampling_method: ode
  num_sampling_steps: [32]
  cfgs: [1]
  self_cond_cfg_scales: [1.0]
  time_schedule: uniform
  df_variant: freeze
  df_commit_thresh: 0.3
  df_t_min: 0.7

# Variant 1 (freeze): entropy threshold 0.5, t >= 0.7 only
- sampling_method: ode
  num_sampling_steps: [32]
  cfgs: [1]
  self_cond_cfg_scales: [1.0]
  time_schedule: uniform
  df_variant: freeze
  df_commit_thresh: 0.5
  df_t_min: 0.7

# Variant 1 (freeze): entropy threshold 1.0, t >= 0.7 only
- sampling_method: ode
  num_sampling_steps: [32]
  cfgs: [1]
  self_cond_cfg_scales: [1.0]
  time_schedule: uniform
  df_variant: freeze
  df_commit_thresh: 1.0
  df_t_min: 0.7

# Variant 3 (soft): alpha=0.3, t >= 0.7 only
- sampling_method: ode
  num_sampling_steps: [32]
  cfgs: [1]
  self_cond_cfg_scales: [1.0]
  time_schedule: uniform
  df_variant: soft
  df_soft_alpha: 0.3
  df_t_min: 0.7

# Variant 3 (soft): alpha=0.5, t >= 0.7 only
- sampling_method: ode
  num_sampling_steps: [32]
  cfgs: [1]
  self_cond_cfg_scales: [1.0]
  time_schedule: uniform
  df_variant: soft
  df_soft_alpha: 0.5
  df_t_min: 0.7

# Variant 3 (soft): alpha=0.7, t >= 0.7 only
- sampling_method: ode
  num_sampling_steps: [32]
  cfgs: [1]
  self_cond_cfg_scales: [1.0]
  time_schedule: uniform
  df_variant: soft
  df_soft_alpha: 0.7
  df_t_min: 0.7
