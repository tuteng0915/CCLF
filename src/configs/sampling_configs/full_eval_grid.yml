# Full ODE + SDE eval grid: steps = 4, 8, 16, 32, 64, 128
# ODE (uniform schedule — matches JAX reference eval)
- sampling_method: ode
  num_sampling_steps: [4]
  cfgs: [1]
  self_cond_cfg_scales: [3]
  time_schedule: uniform

- sampling_method: ode
  num_sampling_steps: [8]
  cfgs: [1]
  self_cond_cfg_scales: [3]
  time_schedule: uniform

- sampling_method: ode
  num_sampling_steps: [16]
  cfgs: [1]
  self_cond_cfg_scales: [3]
  time_schedule: uniform

- sampling_method: ode
  num_sampling_steps: [32]
  cfgs: [1]
  self_cond_cfg_scales: [3]
  time_schedule: uniform

- sampling_method: ode
  num_sampling_steps: [64]
  cfgs: [1]
  self_cond_cfg_scales: [3]
  time_schedule: uniform

- sampling_method: ode
  num_sampling_steps: [128]
  cfgs: [1]
  self_cond_cfg_scales: [3]
  time_schedule: uniform

# SDE (logit-normal, gamma varies by step budget)
- sampling_method: sde
  num_sampling_steps: [4]
  cfgs: [1]
  sde_gamma: 1.5
  self_cond_cfg_scales: [3]
  time_schedule: logit_normal

- sampling_method: sde
  num_sampling_steps: [8]
  cfgs: [1]
  sde_gamma: 1.5
  self_cond_cfg_scales: [3]
  time_schedule: logit_normal

- sampling_method: sde
  num_sampling_steps: [16]
  cfgs: [1]
  sde_gamma: 1.5
  self_cond_cfg_scales: [3]
  time_schedule: logit_normal

- sampling_method: sde
  num_sampling_steps: [32]
  cfgs: [1]
  sde_gamma: 1.5
  self_cond_cfg_scales: [3]
  time_schedule: logit_normal

- sampling_method: sde
  num_sampling_steps: [64]
  cfgs: [1]
  sde_gamma: 1.0
  self_cond_cfg_scales: [3]
  time_schedule: logit_normal

- sampling_method: sde
  num_sampling_steps: [128]
  cfgs: [1]
  sde_gamma: 1.0
  self_cond_cfg_scales: [3]
  time_schedule: logit_normal
