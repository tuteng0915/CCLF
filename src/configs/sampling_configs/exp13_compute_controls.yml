# EXP-13: Compute-matched controls for dec_sc
# Run each mode at steps={8,16,32} with ODE uniform schedule

- sampling_method: ode
  num_sampling_steps: [8, 16, 32]
  cfgs: [1]
  self_cond_cfg_scales: [1]
  time_schedule: uniform
  dec_sc_mode: "none"

