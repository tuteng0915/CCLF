# dec_sc training: L_sc pushes the main denoising output (net_out) toward x̂_t^dec
# in continuous embedding space. After training, inference-time dec_sc quality
# is preserved without the extra 3rd forward pass (2-pass inference instead of 3).
#
# Mechanism:
#   Teacher: backbone(x̂_t^(1), t=1)  — decode branch on first-pass prediction
#   Student: net_out                   — main forward denoising output (has gradients)
#   Loss:    L_sc = ||student - sg(teacher)||²   on denoiser-mode rows
#
# 1 extra no-grad forward per step. Gradient flows via main backward (net_out).

# Dataset
data_path: "embedded-language-flows/openwebtext-t5"
max_length: 1024

# Encoder
encoder_model_name: t5-small
latent_mean: 0.0
latent_std: 0.2

# Model architecture (must match base checkpoint)
model: ELF-B
bottleneck_dim: 128
num_time_tokens: 4
num_self_cond_cfg_tokens: 4
num_model_mode_tokens: 4

# Denoiser objective
denoiser_p_mean: -1.5
denoiser_p_std: 0.8
denoiser_noise_scale: 2.0
t_eps: 0.05
time_schedule: "logit_normal"

# Decoder objective (same as base)
decoder_prob: 0.2
decoder_noise_scale: 5.0
decoder_p_mean: 0.8
decoder_p_std: 0.8

# Conditioning / CFG — must be > 0 for x_pred_init to exist
self_cond_prob: 0.5

# L_sc loss
lambda_sc: 1.0        # weight for embedding-space dec_sc loss
sc_gate_low: 0.0      # apply on all timesteps; restrict to [0.1, 0.6] to focus on cliff
sc_gate_high: 1.0

# Training
epochs: 2
global_batch_size: 512
blr: 0.0003
weight_decay: 0.0
warmup_epochs: 0.1
warmup_steps: -1
optimizer: adamw

# EMA
ema_decay1: 0.9999

# Sampling
sampling_configs_path: "src/configs/sampling_configs/uncond_sampling_configs.yml"
num_samples: 256

# Logging & Checkpointing
log_freq: 100
save_freq: 1
eval_freq: 1

# Output
output_dir: "outputs/elf_b-owt-dec-sc"
hf_repo_id: null
resume: null

# Wandb
use_wandb: true
wandb_project: elf
wandb_entity: null
wandb_run_name: elf_b-owt-dec-sc

# Misc
seed: 42
