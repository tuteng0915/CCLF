## spec-11v2 Diffusion Forcing eval — kd_cr checkpoint, tmin=0.7 gate
## 7 conditions × 256 samples each

# Dataset / tokenizer
data_path: data/owt/val.jsonl
max_length: 128
tokenizer_name: t5-small
encoder_model_name: t5-small

# Model
model: ELF-B
bottleneck_dim: 128
hidden_size: 768
