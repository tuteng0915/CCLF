# Architecture-matched synchronous control for the native WFF pilot.
# The local-time gate exists but all training examples use tau_i=t.
data_path: "embedded-language-flows/openwebtext-t5"
max_length: 128

encoder_model_name: t5-small
latent_mean: 0.0
latent_std: 0.2

model: ELF-B
bottleneck_dim: 128
num_time_tokens: 4
num_self_cond_cfg_tokens: 4
num_model_mode_tokens: 4
per_token_time_conditioning: true

denoiser_p_mean: -1.5
denoiser_p_std: 0.8
denoiser_noise_scale: 2.0
t_eps: 0.05
time_schedule: "logit_normal"
wff_train_prob: 0.0
wff_delta_min: 0.05
wff_delta_max: 0.20
wff_ltr_prob: 0.50
wff_rtl_prob: 0.25

decoder_prob: 0.2
decoder_noise_scale: 5.0
decoder_p_mean: 0.8
decoder_p_std: 0.8
self_cond_prob: 0.5

# Preserve the kd_cr lexical head while adapting the backbone.
lambda_kd: 1.0
kd_temperature: 4.0
kd_gate_low: 0.0
kd_gate_high: 1.0

epochs: 100
max_train_steps: 500
global_batch_size: 32
lr: 0.00001
weight_decay: 0.0
warmup_steps: 20
optimizer: adamw
grad_accum_steps: 1
gradient_checkpointing: false
ema_decay1: 0.9999

sampling_configs_path: "src/configs/sampling_configs/wff_pilot.yml"
num_samples: 256
online_eval: false
log_freq: 20
save_freq: 99999
eval_freq: 99999

output_dir: "outputs/elf_b-owt-wff-control-500"
resume: "converted/elf_b-owt-kd-cr_torch.pt"
resume_model_only: true
use_wandb: false
seed: 42
