# EXP-01: Reverse-trajectory probe — generates 64 sequences and saves per-step states.
# Run: CUDA_VISIBLE_DEVICES=3 python src/eval.py \
#        --config src/configs/training_configs/eval_exp01.yml \
#        --checkpoint_path converted/elf_b-owt-kd-cr_torch.pt

# Dataset / tokenizer
data_path: "embedded-language-flows/openwebtext-t5"
max_length: 1024
tokenizer_name: null
pad_token: "eos"

# Encoder
encoder_model_name: t5-small
encoder_checkpoint: null
latent_mean: 0.0
latent_std: 0.2

# Model architecture — must match kd-cr checkpoint
model: ELF-B
bottleneck_dim: 128
num_time_tokens: 4
num_self_cond_cfg_tokens: 4
num_model_mode_tokens: 4
self_cond_prob: 0.5
attn_dropout: 0.0
proj_dropout: 0.0

# Denoiser
denoiser_noise_scale: 2.0
t_eps: 0.05

# Generation: 64 samples with dense ODE trajectory saved
num_samples: 64
batch_size: 32
seed: 42

# No PPL eval needed — just generate + save trajectories
online_eval: false

# Output
output_dir: "outputs/exp01_baseline"
hf_repo_id: null
use_wandb: false
use_bf16: true
use_compile: false

# Sampling config: 32-step ODE with save_trajectory=true
sampling_configs_path: "src/configs/sampling_configs/exp01_traj_baseline.yml"
