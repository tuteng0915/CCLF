## EXP-35: baseline + dec_sc + DF — completes 3-checkpoint dec_sc×DF matrix
## EXP-33 (kd_cr): all DF+dec_sc hurt; EXP-34 (kd2): all DF+dec_sc hurt
## EXP-35 tests if baseline (where dec_sc and DF both individually help) shows synergy

# Dataset / tokenizer
data_path: data/owt/val.jsonl
max_length: 128
tokenizer_name: t5-small
encoder_model_name: t5-small

# Model
model: ELF-B
bottleneck_dim: 128
hidden_size: 768
num_layers: 12
num_heads: 12
num_time_tokens: 4
num_self_cond_cfg_tokens: 4
num_model_mode_tokens: 4

# Eval settings
num_samples: 256
seed: 42
batch_size: 16
output_dir: outputs/exp35_baseline_decsc

# Sampling configs
sampling_configs_path: src/configs/sampling_configs/spec33_df_decsc.yml
