## EXP-36a: baseline + dec_sc(tmin=0.5) + DF — valid interaction test
## Fixes EXP-35 (which used no tmin gate → degenerate outputs)

data_path: data/owt/val.jsonl
max_length: 128
tokenizer_name: t5-small
encoder_model_name: t5-small

model: ELF-B
bottleneck_dim: 128
hidden_size: 768
num_layers: 12
num_heads: 12
num_time_tokens: 4
num_self_cond_cfg_tokens: 4
num_model_mode_tokens: 4

num_samples: 256
seed: 42
batch_size: 16
output_dir: outputs/exp36_baseline_decsc_gated

sampling_configs_path: src/configs/sampling_configs/spec36_df_decsc_gated.yml
