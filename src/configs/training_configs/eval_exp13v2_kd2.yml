# EXP-13v2: Fixed decode mode (tmin=0.5), kd2 checkpoint
# Run via: python src/eval.py --config src/configs/training_configs/eval_exp13.yml --checkpoint_path <path>

# Dataset / tokenizer
data_path: "embedded-language-flows/openwebtext-t5"
max_length: 1024
tokenizer_name: null
pad_token: "eos"

# Encoder
encoder_model_name: t5-small
encoder_checkpoint: null
latent_mean: 0.0
latent_std: 0.2

# Model architecture — must match base checkpoint exactly
model: ELF-B
bottleneck_dim: 128
num_time_tokens: 4
num_self_cond_cfg_tokens: 4
num_model_mode_tokens: 4
self_cond_prob: 0.5
attn_dropout: 0.0
proj_dropout: 0.0

# Denoiser
denoiser_noise_scale: 2.0
t_eps: 0.05

# Generation params
num_samples: 512
batch_size: 32
seed: 456

# Eval / PPL
online_eval: true
eval_ppl_model: "gpt2-large"
eval_ppl_batch_size: 32
eval_ppl_max_length: 1024
max_input_length: 1024

# Output
output_dir: "outputs/exp13v2_kd2"
hf_repo_id: null
use_wandb: false
use_bf16: true
use_compile: false

# Sampling configs (all EXP-13 modes)
sampling_configs_path: "src/configs/sampling_configs/exp13v2_tmin.yml"
