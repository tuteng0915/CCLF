# EXP-62 controlled checkpoint-panel pilot.
# Override lambda_kd, kd_gate_low/high, output_dir, and seed per family.
data_path: "embedded-language-flows/openwebtext-t5"
max_length: 128

encoder_model_name: t5-small
latent_mean: 0.0
latent_std: 0.2

model: ELF-B
bottleneck_dim: 128
num_time_tokens: 4
num_self_cond_cfg_tokens: 4
num_model_mode_tokens: 4

denoiser_p_mean: -1.5
denoiser_p_std: 0.8
denoiser_noise_scale: 2.0
t_eps: 0.05
time_schedule: "logit_normal"

decoder_prob: 0.2
decoder_noise_scale: 5.0
decoder_p_mean: 0.8
decoder_p_std: 0.8
self_cond_prob: 0.5

# Default family: full-trajectory KD. Set lambda_kd=0 for ct_control.
lambda_kd: 1.0
kd_temperature: 4.0
kd_gate_low: 0.0
kd_gate_high: 1.0

epochs: 100
max_train_steps: 2000
global_batch_size: 32
lr: 0.00001
weight_decay: 0.0
warmup_steps: 20
optimizer: adamw
grad_accum_steps: 1
gradient_checkpointing: false
ema_decay1: 0.9999

sampling_configs_path: "src/configs/sampling_configs/uncond_sampling_configs.yml"
num_samples: 256
online_eval: false
log_freq: 20
save_freq: 99999
eval_freq: 99999

output_dir: "outputs/elf_b-owt-panel-placeholder"
resume: "converted/elf_b-owt-baseline_torch.pt"
resume_model_only: true
use_wandb: false
seed: 42
