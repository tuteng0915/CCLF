## EXP-32: kd2 DF step-count sweep — none + freeze_1.0 at 8 and 16 ODE steps
## freeze_1.0 is best condition (−48.9% at 32 steps, EXP-31b)

# Dataset / tokenizer
data_path: data/owt/val.jsonl
max_length: 128
tokenizer_name: t5-small
encoder_model_name: t5-small

# Model
model: ELF-B
bottleneck_dim: 128
hidden_size: 768
num_layers: 12
num_heads: 12
num_time_tokens: 4
num_self_cond_cfg_tokens: 4
num_model_mode_tokens: 4

# Eval settings
num_samples: 256
seed: 456
batch_size: 16
output_dir: outputs/exp32_kd2_steps

# Sampling configs
sampling_configs_path: src/configs/sampling_configs/spec32_kd2_steps.yml
