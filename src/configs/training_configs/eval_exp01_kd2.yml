# EXP-01: Reverse-trajectory probe for kd2 checkpoint.
# Run: CUDA_VISIBLE_DEVICES=X python src/eval.py \
#        --config src/configs/training_configs/eval_exp01_kd2.yml \
#        --checkpoint_path converted/elf_b-owt-kd2_torch.pt

data_path: "embedded-language-flows/openwebtext-t5"
max_length: 1024
tokenizer_name: null
pad_token: "eos"

encoder_model_name: t5-small
encoder_checkpoint: null
latent_mean: 0.0
latent_std: 0.2

model: ELF-B
bottleneck_dim: 128
num_time_tokens: 4
num_self_cond_cfg_tokens: 4
num_model_mode_tokens: 4
self_cond_prob: 0.5
attn_dropout: 0.0
proj_dropout: 0.0

denoiser_noise_scale: 2.0
t_eps: 0.05

num_samples: 64
batch_size: 32
seed: 42

online_eval: false

output_dir: "outputs/exp01_kd2"
hf_repo_id: null
use_wandb: false
use_bf16: true
use_compile: false

sampling_configs_path: "src/configs/sampling_configs/exp01_traj_kd2.yml"
