# dec_sc SDE: missing steps 8, 16, 32 (gamma=1.5) and 64, 128 (gamma=1.0)
- sampling_method: sde
  num_sampling_steps: [8, 16, 32]
  cfgs: [1]
  sde_gamma: 1.5
  self_cond_cfg_scales: [3]
  time_schedule: logit_normal
  use_dec_sc: true

- sampling_method: sde
  num_sampling_steps: [64, 128]
  cfgs: [1]
  sde_gamma: 1.0
  self_cond_cfg_scales: [3]
  time_schedule: logit_normal
  use_dec_sc: true
