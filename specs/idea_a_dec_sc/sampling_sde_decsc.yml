# SDE full grid: steps 4,8,16,32,64,128 — dec_sc=true
- sampling_method: sde
  num_sampling_steps: [4, 8]
  cfgs: [1]
  sde_gamma: 1.5
  self_cond_cfg_scales: [3]
  time_schedule: logit_normal
  use_dec_sc: true

- sampling_method: sde
  num_sampling_steps: [16, 32]
  cfgs: [1]
  sde_gamma: 1.5
  self_cond_cfg_scales: [3]
  time_schedule: logit_normal
  use_dec_sc: true

- sampling_method: sde
  num_sampling_steps: [64, 128]
  cfgs: [1]
  sde_gamma: 1.0
  self_cond_cfg_scales: [3]
  time_schedule: logit_normal
  use_dec_sc: true
