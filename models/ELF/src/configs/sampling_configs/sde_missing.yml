# SDE missing steps: 4 and 128 only
- sampling_method: sde
  num_sampling_steps: [4]
  cfgs: [1]
  sde_gamma: 1.5
  self_cond_cfg_scales: [3]
  time_schedule: logit_normal
  use_dec_sc: false

- sampling_method: sde
  num_sampling_steps: [128]
  cfgs: [1]
  sde_gamma: 1.0
  self_cond_cfg_scales: [3]
  time_schedule: logit_normal
  use_dec_sc: false
